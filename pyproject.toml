[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-sysadmin-training-tools"
version = "0.1.0"
description = "Standard-library examples for Python Linux system administrators"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sysadmin-inventory = "sysadmintools.inventory:main"
sysadmin-service-check = "sysadmintools.service_check:main"
sysadmin-disk-report = "sysadmintools.disk_report:main"
sysadmin-url-check = "sysadmintools.url_check:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["sysadmintools"]
